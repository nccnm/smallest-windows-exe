<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="Build pipeline from source through compiler and linker to exe; the same program shrinks from 111,104 bytes to 768 bytes over four levels"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0.5" y="0.5" width="919" height="399" rx="14" fill="#fcfcfb" stroke="#e4e2dc"/><text x="24" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#0b0b0b" font-weight="600">From source to exe: how many bytes each decision removes</text><rect x="30" y="60" width="196" height="106" rx="8" fill="#efeee9" stroke="#8a8880" stroke-width="1.5"/><text x="42" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">C source</text><text x="42" y="102" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">start() function</text><text x="42" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">calls WriteFile</text><text x="42" y="134" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">calls ExitProcess</text><line x1="228" y1="113" x2="248" y2="113" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><rect x="250" y="60" width="196" height="106" rx="8" fill="#efeee9" stroke="#8a8880" stroke-width="1.5"/><text x="262" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Compiler (cl /c)</text><text x="262" y="102" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">/O1 /Os: optimize for size</text><text x="262" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">/GS-: no stack cookie</text><text x="262" y="134" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">emits a .obj file</text><line x1="448" y1="113" x2="468" y2="113" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><rect x="470" y="60" width="196" height="106" rx="8" fill="#efeee9" stroke="#8a8880" stroke-width="1.5"/><text x="482" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Linker (link)</text><text x="482" y="102" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">/NODEFAULTLIB</text><text x="482" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">/ENTRY:start</text><text x="482" y="134" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">/MERGE, /ALIGN:16</text><line x1="668" y1="113" x2="688" y2="113" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><rect x="690" y="60" width="196" height="106" rx="8" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><text x="702" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">.exe file</text><text x="702" y="102" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">PE header</text><text x="702" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">1 section</text><text x="702" y="134" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">kernel32 import table</text><text x="30" y="210" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">The same Hello World, four levels:</text><text x="240" y="243" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end">C + static CRT (/MT)</text><rect x="250" y="229" width="471.4314249674742" height="20" rx="3" fill="#1baf7a"/><text x="729.4314249674742" y="244" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">111,104 B - the default</text><text x="240" y="281" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end">C + dynamic CRT (/MD)</text><rect x="250" y="267" width="275.5599188756778" height="20" rx="3" fill="#1baf7a"/><text x="533.5599188756778" y="282" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">9,728 B - CRT lives in external DLLs</text><text x="240" y="319" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end">No CRT, default linker</text><rect x="250" y="305" width="168.192586168861" height="20" rx="3" fill="#1baf7a"/><text x="426.192586168861" y="320" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">2,560 B - own entry point</text><text x="240" y="357" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end">No CRT, merged sections, align 16</text><rect x="250" y="343" width="71.36318889472449" height="20" rx="3" fill="#2a78d6"/><text x="329.3631888947245" y="358" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">768 B - linker flags only</text><text x="250" y="386" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e">Bars are drawn on a log scale</text></svg>