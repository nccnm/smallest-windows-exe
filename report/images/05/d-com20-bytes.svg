<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="The twenty bytes of the DOS file MYHELLO.COM: four 16-bit machine instructions in 8 bytes and the 12-byte string HELLO WORLD$"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0.5" y="0.5" width="919" height="399" rx="14" fill="#fcfcfb" stroke="#e4e2dc"/><text x="24" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#0b0b0b" font-weight="600">The file MYHELLO.COM: all 20 bytes</text><text x="24" y="52" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">No header. The very first byte is a 16-bit machine instruction. DOS copies the whole file to memory at address 0x100 and runs from there</text><text x="40" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e" font-weight="600">8 bytes of 16-bit machine code</text><text x="376" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e" font-weight="600">12 bytes of text</text><rect x="40" y="120" width="39" height="58" rx="4" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><text x="59.5" y="154" font-family="Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">B4</text><text x="40" y="112" font-family="Consolas, monospace" font-size="11" fill="#52514e">0x100</text><rect x="82" y="120" width="39" height="58" rx="4" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><text x="101.5" y="154" font-family="Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">09</text><rect x="124" y="120" width="39" height="58" rx="4" fill="#e4e0fa" stroke="#6250d6" stroke-width="1.5"/><text x="143.5" y="154" font-family="Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">BA</text><text x="124" y="112" font-family="Consolas, monospace" font-size="11" fill="#52514e">0x102</text><rect x="166" y="120" width="39" height="58" rx="4" fill="#e4e0fa" stroke="#6250d6" stroke-width="1.5"/><text x="185.5" y="154" font-family="Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">08</text><rect x="208" y="120" width="39" height="58" rx="4" fill="#e4e0fa" stroke="#6250d6" stroke-width="1.5"/><text x="227.5" y="154" font-family="Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">01</text><rect x="250" y="120" width="39" height="58" rx="4" fill="#fde3d6" stroke="#eb6834" stroke-width="1.5"/><text x="269.5" y="154" font-family="Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">CD</text><text x="250" y="112" font-family="Consolas, monospace" font-size="11" fill="#52514e">0x105</text><rect x="292" y="120" width="39" height="58" rx="4" fill="#fde3d6" stroke="#eb6834" stroke-width="1.5"/><text x="311.5" y="154" font-family="Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">21</text><rect x="334" y="120" width="39" height="58" rx="4" fill="#efeee9" stroke="#8a8880" stroke-width="1.5"/><text x="353.5" y="154" font-family="Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">C3</text><text x="334" y="112" font-family="Consolas, monospace" font-size="11" fill="#52514e">0x107</text><rect x="376" y="120" width="39" height="58" rx="4" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="395.5" y="144" font-family="Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">48</text><text x="395.5" y="166" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#52514e" text-anchor="middle">H</text><rect x="418" y="120" width="39" height="58" rx="4" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="437.5" y="144" font-family="Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">45</text><text x="437.5" y="166" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#52514e" text-anchor="middle">E</text><rect x="460" y="120" width="39" height="58" rx="4" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="479.5" y="144" font-family="Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">4C</text><text x="479.5" y="166" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#52514e" text-anchor="middle">L</text><rect x="502" y="120" width="39" height="58" rx="4" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="521.5" y="144" font-family="Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">4C</text><text x="521.5" y="166" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#52514e" text-anchor="middle">L</text><rect x="544" y="120" width="39" height="58" rx="4" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="563.5" y="144" font-family="Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">4F</text><text x="563.5" y="166" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#52514e" text-anchor="middle">O</text><rect x="586" y="120" width="39" height="58" rx="4" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="605.5" y="144" font-family="Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">20</text><text x="605.5" y="166" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#52514e" text-anchor="middle">␠</text><rect x="628" y="120" width="39" height="58" rx="4" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="647.5" y="144" font-family="Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">57</text><text x="647.5" y="166" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#52514e" text-anchor="middle">W</text><rect x="670" y="120" width="39" height="58" rx="4" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="689.5" y="144" font-family="Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">4F</text><text x="689.5" y="166" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#52514e" text-anchor="middle">O</text><rect x="712" y="120" width="39" height="58" rx="4" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="731.5" y="144" font-family="Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">52</text><text x="731.5" y="166" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#52514e" text-anchor="middle">R</text><rect x="754" y="120" width="39" height="58" rx="4" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="773.5" y="144" font-family="Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">4C</text><text x="773.5" y="166" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#52514e" text-anchor="middle">L</text><rect x="796" y="120" width="39" height="58" rx="4" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="815.5" y="144" font-family="Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">44</text><text x="815.5" y="166" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#52514e" text-anchor="middle">D</text><rect x="838" y="120" width="39" height="58" rx="4" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="857.5" y="144" font-family="Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">24</text><text x="857.5" y="166" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#52514e" text-anchor="middle">$</text><path d="M 40 188 v 6 H 121 v -6" fill="none" stroke="#2a78d6" stroke-width="1.5"/><line x1="80.5" y1="194" x2="100" y2="244" stroke="#2a78d6" stroke-width="1.5"/><rect x="40" y="244" width="138" height="78" rx="6" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><text x="50" y="264" font-family="Consolas, monospace" font-size="12.5" fill="#0b0b0b" font-weight="600">mov ah, 9</text><text x="50" y="286" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">pick DOS service 9:</text><text x="50" y="304" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">print a string</text><path d="M 124 188 v 6 H 247 v -6" fill="none" stroke="#6250d6" stroke-width="1.5"/><line x1="185.5" y1="194" x2="250" y2="244" stroke="#6250d6" stroke-width="1.5"/><rect x="190" y="244" width="138" height="78" rx="6" fill="#e4e0fa" stroke="#6250d6" stroke-width="1.5"/><text x="200" y="264" font-family="Consolas, monospace" font-size="12.5" fill="#0b0b0b" font-weight="600">mov dx, 0x108</text><text x="200" y="286" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">address of the</text><text x="200" y="304" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">string to print</text><path d="M 250 188 v 6 H 331 v -6" fill="none" stroke="#eb6834" stroke-width="1.5"/><line x1="290.5" y1="194" x2="400" y2="244" stroke="#eb6834" stroke-width="1.5"/><rect x="340" y="244" width="138" height="78" rx="6" fill="#fde3d6" stroke="#eb6834" stroke-width="1.5"/><text x="350" y="264" font-family="Consolas, monospace" font-size="12.5" fill="#0b0b0b" font-weight="600">int 0x21</text><text x="350" y="286" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">call DOS</text><text x="350" y="304" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">to do it</text><path d="M 334 188 v 6 H 373 v -6" fill="none" stroke="#8a8880" stroke-width="1.5"/><line x1="353.5" y1="194" x2="550" y2="244" stroke="#8a8880" stroke-width="1.5"/><rect x="490" y="244" width="138" height="78" rx="6" fill="#efeee9" stroke="#8a8880" stroke-width="1.5"/><text x="500" y="264" font-family="Consolas, monospace" font-size="12.5" fill="#0b0b0b" font-weight="600">ret</text><text x="500" y="286" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">hand control</text><text x="500" y="304" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">back to DOS</text><path d="M 376 188 v 6 H 877 v -6" fill="none" stroke="#1baf7a" stroke-width="1.5"/><line x1="770" y1="194" x2="770" y2="244" stroke="#1baf7a" stroke-width="1.5"/><rect x="650" y="244" width="246" height="78" rx="6" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="660" y="264" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="600">the string &quot;HELLO WORLD$&quot;</text><text x="660" y="286" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Data, not instructions</text><text x="660" y="304" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">DOS prints until it meets the $</text><path d="M 187 120 V 98 H 394 V 118" fill="none" stroke="#6250d6" stroke-width="1.6" marker-end="url(#arr)"/><text x="290.5" y="93" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#6250d6" text-anchor="middle" font-weight="600">0x108 points here</text><text x="24" y="366" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#52514e">int 0x21 is how a DOS program asks the operating system to do work. Windows has no such mechanism: Windows programs</text><text x="24" y="384" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#52514e">call functions in DLLs. So these 20 bytes only mean something with DOS, or a DOS emulator, underneath</text></svg>