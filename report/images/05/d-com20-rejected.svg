<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 530" width="920" height="530" role="img" aria-label="64-bit Windows 11 rejects the 20-byte DOS file with error 216 before creating a process, while the 268-byte PE file runs and exits with code 42"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0.5" y="0.5" width="919" height="529" rx="14" fill="#fcfcfb" stroke="#e4e2dc"/><text x="24" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#0b0b0b" font-weight="600">What 64-bit Windows 11 does with the 20-byte file, next to the 268-byte file</text><text x="24" y="66" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="600">MYHELLO.COM, 20 bytes</text><rect x="24" y="76" width="206" height="76" rx="8" fill="#fcfcfb" stroke="#e4e2dc" stroke-width="1"/><text x="36" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" font-weight="600">Kernel opens the file</text><text x="36" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">First two bytes: B4 09</text><text x="36" y="136" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Not &quot;MZ&quot;</text><line x1="230" y1="114" x2="244" y2="114" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><rect x="246" y="76" width="206" height="76" rx="8" fill="#fcfcfb" stroke="#e4e2dc" stroke-width="1"/><text x="258" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" font-weight="600">Not a PE file</text><text x="258" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Windows treats it as a</text><text x="258" y="136" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">16-bit DOS program</text><line x1="452" y1="114" x2="466" y2="114" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><rect x="468" y="76" width="206" height="76" rx="8" fill="#fcfcfb" stroke="#e4e2dc" stroke-width="1"/><text x="480" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" font-weight="600">Needs the DOS VM (NTVDM)</text><text x="480" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Only in 32-bit Windows</text><text x="480" y="136" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">64-bit Windows has none</text><line x1="674" y1="114" x2="688" y2="114" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><rect x="690" y="76" width="206" height="76" rx="8" fill="#fbdcdc" stroke="#e34948" stroke-width="1.6"/><text x="702" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" font-weight="600">Rejected, error 216</text><text x="702" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">No process is created</text><text x="702" y="136" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Not one instruction runs</text><text x="24" y="186" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="600">tiny268.exe, 268 bytes</text><rect x="24" y="196" width="206" height="76" rx="8" fill="#fcfcfb" stroke="#e4e2dc" stroke-width="1"/><text x="36" y="220" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" font-weight="600">Kernel opens the file</text><text x="36" y="238" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">First two bytes: 4D 5A</text><text x="36" y="256" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">That is &quot;MZ&quot;</text><line x1="230" y1="234" x2="244" y2="234" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><rect x="246" y="196" width="206" height="76" rx="8" fill="#fcfcfb" stroke="#e4e2dc" stroke-width="1"/><text x="258" y="220" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" font-weight="600">Follows e_lfanew to &quot;PE&quot;</text><text x="258" y="238" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Header says CPU type: x64</text><text x="258" y="256" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">File is the full 268 bytes</text><line x1="452" y1="234" x2="466" y2="234" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><rect x="468" y="196" width="206" height="76" rx="8" fill="#fcfcfb" stroke="#e4e2dc" stroke-width="1"/><text x="480" y="220" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" font-weight="600">Process is created</text><text x="480" y="238" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">File and ntdll.dll are</text><text x="480" y="256" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">mapped into memory</text><line x1="674" y1="234" x2="688" y2="234" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><rect x="690" y="196" width="206" height="76" rx="8" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.6"/><text x="702" y="220" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" font-weight="600">Runs</text><text x="702" y="238" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">4 bytes of 64-bit code</text><text x="702" y="256" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Exits with code 42</text><text x="24" y="312" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="600">Actual messages when running MYHELLO.COM on this machine (Windows 11 build 26300, x64)</text><rect x="24" y="326" width="872" height="74" rx="6" fill="#fcfcfb" stroke="#e4e2dc" stroke-width="1"/><text x="36" y="348" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" font-weight="600">cmd.exe</text><text x="180" y="348" font-family="Consolas, monospace" font-size="11.5" fill="#0b0b0b">This version of ...MYHELLO.COM is not compatible with the version of Windows you're running.</text><text x="180" y="366" font-family="Consolas, monospace" font-size="11.5" fill="#0b0b0b">Check your computer's system information and then contact the software publisher.</text><text x="180" y="384" font-family="Consolas, monospace" font-size="11.5" fill="#e34948">errorlevel = 216</text><rect x="24" y="408" width="872" height="56" rx="6" fill="#fcfcfb" stroke="#e4e2dc" stroke-width="1"/><text x="36" y="430" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" font-weight="600">PowerShell 7</text><text x="180" y="430" font-family="Consolas, monospace" font-size="11.5" fill="#0b0b0b">The specified executable is not a valid application for this OS platform.</text><text x="180" y="448" font-family="Consolas, monospace" font-size="11.5" fill="#e34948">native error code = 216</text><rect x="24" y="472" width="872" height="38" rx="6" fill="#fcfcfb" stroke="#e4e2dc" stroke-width="1"/><text x="36" y="494" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" font-weight="600">CreateProcess call</text><text x="180" y="494" font-family="Consolas, monospace" font-size="11.5" fill="#0b0b0b">WinError 216, named ERROR_EXE_MACHINE_TYPE_MISMATCH</text></svg>