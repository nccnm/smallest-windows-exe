<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" width="920" height="680" role="img" aria-label="Seven steps from double click to running program: Explorer, the kernel opens the file, process creation, loader, entry point, the program runs, exit"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0.5" y="0.5" width="919" height="679" rx="14" fill="#fcfcfb" stroke="#e4e2dc"/><text x="24" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#0b0b0b" font-weight="600">From double click to running program: seven steps</text><rect x="24" y="46" width="14" height="14" rx="3" fill="#fdf0cc" stroke="#eda100" stroke-width="1"/><text x="44" y="58" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Before a process exists</text><rect x="274" y="46" width="14" height="14" rx="3" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1"/><text x="294" y="58" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Windows prepares the process</text><rect x="524" y="46" width="14" height="14" rx="3" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1"/><text x="544" y="58" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Your code runs</text><rect x="30" y="86" width="250" height="66" rx="8" fill="#fdf0cc" stroke="#eda100" stroke-width="1.5"/><circle cx="58" cy="119" r="15" fill="#eda100"/><text x="58" y="124" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">1</text><text x="84" y="124" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Explorer gets the open request</text><rect x="310" y="86" width="580" height="66" rx="8" fill="#fcfcfb" stroke="#e4e2dc" stroke-width="1"/><text x="326" y="114" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">Sees an exe file and calls the CreateProcess function</text><text x="326" y="132" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">File downloaded from the Internet: Windows shows a warning before this step</text><line x1="280" y1="119" x2="310" y2="119" stroke="#e4e2dc" stroke-width="1.5"/><line x1="155" y1="152" x2="155" y2="168" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><rect x="30" y="170" width="250" height="66" rx="8" fill="#fdf0cc" stroke="#eda100" stroke-width="1.5"/><circle cx="58" cy="203" r="15" fill="#eda100"/><text x="58" y="208" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">2</text><text x="84" y="208" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">The kernel opens the file</text><rect x="310" y="170" width="580" height="66" rx="8" fill="#fcfcfb" stroke="#e4e2dc" stroke-width="1"/><text x="326" y="198" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">Reads the headers and checks the shape of the file</text><text x="326" y="216" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#e34948" font-weight="600">Wrong shape: error 216 or 193, and no process exists yet</text><line x1="280" y1="203" x2="310" y2="203" stroke="#e4e2dc" stroke-width="1.5"/><line x1="155" y1="236" x2="155" y2="252" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><rect x="30" y="254" width="250" height="66" rx="8" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><circle cx="58" cy="287" r="15" fill="#2a78d6"/><text x="58" y="292" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">3</text><text x="84" y="292" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">The process is created</text><rect x="310" y="254" width="580" height="66" rx="8" fill="#fcfcfb" stroke="#e4e2dc" stroke-width="1"/><text x="326" y="282" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">Gets its own, still empty, address space</text><text x="326" y="300" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">hello.exe and ntdll.dll are mapped in; the first thread and its stack are created</text><line x1="280" y1="287" x2="310" y2="287" stroke="#e4e2dc" stroke-width="1.5"/><line x1="155" y1="320" x2="155" y2="336" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><rect x="30" y="338" width="250" height="66" rx="8" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><circle cx="58" cy="371" r="15" fill="#2a78d6"/><text x="58" y="376" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">4</text><text x="84" y="376" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">The loader runs</text><rect x="310" y="338" width="580" height="66" rx="8" fill="#fcfcfb" stroke="#e4e2dc" stroke-width="1"/><text x="326" y="357" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">It is code in ntdll.dll, running inside the new process</text><text x="326" y="375" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">Reads the import table, loads each DLL, writes each function address into the table</text><text x="326" y="393" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#e34948" font-weight="600">A DLL is missing: the process dies with code 0xC0000135</text><line x1="280" y1="371" x2="310" y2="371" stroke="#e4e2dc" stroke-width="1.5"/><line x1="155" y1="404" x2="155" y2="420" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><rect x="30" y="422" width="250" height="66" rx="8" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><circle cx="58" cy="455" r="15" fill="#2a78d6"/><text x="58" y="460" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">5</text><text x="84" y="460" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Jump to the entry point</text><rect x="310" y="422" width="580" height="66" rx="8" fill="#fcfcfb" stroke="#e4e2dc" stroke-width="1"/><text x="326" y="450" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">With CRT: the CRT startup code runs first, then main()</text><text x="326" y="468" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">Without CRT: the start() function you wrote runs directly</text><line x1="280" y1="455" x2="310" y2="455" stroke="#e4e2dc" stroke-width="1.5"/><line x1="155" y1="488" x2="155" y2="504" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><rect x="30" y="506" width="250" height="66" rx="8" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><circle cx="58" cy="539" r="15" fill="#1baf7a"/><text x="58" y="544" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">6</text><text x="84" y="544" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">The program runs</text><rect x="310" y="506" width="580" height="66" rx="8" fill="#fcfcfb" stroke="#e4e2dc" stroke-width="1"/><text x="326" y="543" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">Calls WriteFile and ExitProcess through the addresses written in step 4</text><line x1="280" y1="539" x2="310" y2="539" stroke="#e4e2dc" stroke-width="1.5"/><line x1="155" y1="572" x2="155" y2="588" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><rect x="30" y="590" width="250" height="66" rx="8" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><circle cx="58" cy="623" r="15" fill="#1baf7a"/><text x="58" y="628" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">7</text><text x="84" y="628" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Exit</text><rect x="310" y="590" width="580" height="66" rx="8" fill="#fcfcfb" stroke="#e4e2dc" stroke-width="1"/><text x="326" y="627" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">Windows reclaims all of the memory of the process</text><line x1="280" y1="623" x2="310" y2="623" stroke="#e4e2dc" stroke-width="1.5"/></svg>