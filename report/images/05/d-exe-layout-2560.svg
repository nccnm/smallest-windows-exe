<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 612" width="920" height="612" role="img" aria-label="Layout of the 2,560-byte exe file: DOS header, DOS stub, 264-byte PE header, section table, padding, and the three sections .text, .rdata, .pdata"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0.5" y="0.5" width="919" height="611" rx="14" fill="#fcfcfb" stroke="#e4e2dc"/><text x="24" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#0b0b0b" font-weight="600">Inside an ordinary exe file: 2,560 bytes</text><text x="24" y="52" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">File msvc_nocrt_plain.exe. The gray bar in each section is padding, the colored bar is real content</text><text x="138" y="101" font-family="Consolas, monospace" font-size="12" fill="#52514e" text-anchor="end">0x000</text><rect x="150" y="70" width="230" height="52" rx="6" fill="#fdf0cc" stroke="#eda100" stroke-width="1.5"/><text x="162" y="92" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">DOS header</text><text x="368" y="92" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e" text-anchor="end">64 B</text><text x="396" y="92" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">Starts with the two letters &quot;MZ&quot;</text><text x="396" y="110" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">The 4 bytes at 0x3C are e_lfanew = 0xD0</text><text x="138" y="163" font-family="Consolas, monospace" font-size="12" fill="#52514e" text-anchor="end">0x040</text><rect x="150" y="132" width="230" height="52" rx="6" fill="#fdf0cc" stroke="#eda100" stroke-width="1.5"/><text x="162" y="154" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">DOS stub</text><text x="368" y="154" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e" text-anchor="end">144 B</text><text x="396" y="154" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">A tiny DOS program that prints an error message</text><text x="396" y="172" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">Windows never reads it</text><text x="138" y="225" font-family="Consolas, monospace" font-size="12" fill="#52514e" text-anchor="end">0x0D0</text><rect x="150" y="194" width="230" height="52" rx="6" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><text x="162" y="216" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">PE header</text><text x="368" y="216" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e" text-anchor="end">264 B</text><text x="396" y="216" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">&quot;PE&quot; signature 4 B + COFF header 20 B + Optional header 240 B</text><text x="396" y="234" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">CPU type, entry point, alignment, 16 data directory entries</text><text x="138" y="287" font-family="Consolas, monospace" font-size="12" fill="#52514e" text-anchor="end">0x1D8</text><rect x="150" y="256" width="230" height="52" rx="6" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><text x="162" y="278" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Section table</text><text x="368" y="278" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e" text-anchor="end">120 B</text><text x="396" y="278" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">3 rows of 40 bytes, each describing one section:</text><text x="396" y="296" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">name, position in the file, position in memory, permissions</text><text x="138" y="349" font-family="Consolas, monospace" font-size="12" fill="#52514e" text-anchor="end">0x250</text><rect x="150" y="318" width="230" height="52" rx="6" fill="#efeee9" stroke="#8a8880" stroke-width="1.5"/><text x="162" y="340" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Padding</text><text x="368" y="340" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e" text-anchor="end">432 B</text><rect x="162" y="350" width="206" height="9" rx="2" fill="#c9c7c0"/><rect x="162" y="350" width="0" height="9" rx="2" fill="#8a8880"/><text x="396" y="359" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">432 bytes padding</text><text x="396" y="338" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">All zeros, so that the first section starts at 0x400</text><text x="138" y="411" font-family="Consolas, monospace" font-size="12" fill="#52514e" text-anchor="end">0x400</text><rect x="150" y="380" width="230" height="52" rx="6" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="162" y="402" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">.text</text><text x="368" y="402" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e" text-anchor="end">512 B</text><rect x="162" y="412" width="206" height="9" rx="2" fill="#c9c7c0"/><rect x="162" y="412" width="24.140625" height="9" rx="2" fill="#1baf7a"/><text x="396" y="421" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">60 bytes used, 452 bytes padding</text><text x="396" y="400" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">The machine code of the program</text><text x="138" y="473" font-family="Consolas, monospace" font-size="12" fill="#52514e" text-anchor="end">0x600</text><rect x="150" y="442" width="230" height="52" rx="6" fill="#e4e0fa" stroke="#6250d6" stroke-width="1.5"/><text x="162" y="464" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">.rdata</text><text x="368" y="464" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e" text-anchor="end">512 B</text><rect x="162" y="474" width="206" height="9" rx="2" fill="#c9c7c0"/><rect x="162" y="474" width="183.46875" height="9" rx="2" fill="#6250d6"/><text x="396" y="483" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">456 bytes used, 56 bytes padding</text><text x="396" y="462" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">The string &quot;Hello, World!&quot; and the import table</text><text x="138" y="535" font-family="Consolas, monospace" font-size="12" fill="#52514e" text-anchor="end">0x800</text><rect x="150" y="504" width="230" height="52" rx="6" fill="#fde3d6" stroke="#eb6834" stroke-width="1.5"/><text x="162" y="526" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">.pdata</text><text x="368" y="526" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e" text-anchor="end">512 B</text><rect x="162" y="536" width="206" height="9" rx="2" fill="#c9c7c0"/><rect x="162" y="536" width="4.828125" height="9" rx="2" fill="#eb6834"/><text x="396" y="545" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">12 bytes used, 500 bytes padding</text><text x="396" y="524" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">Exception handling table</text><path d="M 88 96 H 38 V 220 H 88" fill="none" stroke="#e34948" stroke-width="1.8" marker-end="url(#arr)"/><text x="30" y="158" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e34948" text-anchor="middle" transform="rotate(-90 30 158)">e_lfanew points here</text><text x="138" y="572" font-family="Consolas, monospace" font-size="12" fill="#52514e" text-anchor="end">0xA00</text><text x="150" y="572" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">end of file: 2,560 bytes, of which 1,440 bytes are padding</text></svg>