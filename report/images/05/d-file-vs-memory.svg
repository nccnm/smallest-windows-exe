<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410" role="img" aria-label="The file on disk with 512-byte alignment versus in memory with 4,096-byte alignment: headers and three sections, each on its own page with its own permissions"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0.5" y="0.5" width="919" height="409" rx="14" fill="#fcfcfb" stroke="#e4e2dc"/><text x="24" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#0b0b0b" font-weight="600">The same file: packed tight on disk, one page per section in memory</text><text x="220" y="72" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">IN THE FILE (512-byte alignment)</text><text x="665" y="72" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">IN MEMORY (4,096-byte alignment)</text><rect x="120" y="96" width="200" height="49" rx="5" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><text x="132" y="125" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">header</text><text x="110" y="125" font-family="Consolas, monospace" font-size="12" fill="#52514e" text-anchor="end">0x000</text><rect x="540" y="96" width="250" height="62" rx="6" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><text x="552" y="121" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">header</text><text x="552" y="142" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">page 1: read only</text><text x="802" y="131" font-family="Consolas, monospace" font-size="12" fill="#52514e">RVA 0x0000</text><line x1="324" y1="121" x2="534" y2="127" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><rect x="120" y="148" width="200" height="23" rx="5" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="132" y="164" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">.text</text><text x="110" y="164" font-family="Consolas, monospace" font-size="12" fill="#52514e" text-anchor="end">0x400</text><rect x="540" y="164" width="250" height="62" rx="6" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="552" y="189" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">.text</text><text x="552" y="210" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">page 2: read and execute</text><text x="802" y="199" font-family="Consolas, monospace" font-size="12" fill="#52514e">RVA 0x1000</text><line x1="324" y1="160" x2="534" y2="195" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><rect x="120" y="174" width="200" height="23" rx="5" fill="#e4e0fa" stroke="#6250d6" stroke-width="1.5"/><text x="132" y="190" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">.rdata</text><text x="110" y="190" font-family="Consolas, monospace" font-size="12" fill="#52514e" text-anchor="end">0x600</text><rect x="540" y="232" width="250" height="62" rx="6" fill="#e4e0fa" stroke="#6250d6" stroke-width="1.5"/><text x="552" y="257" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">.rdata</text><text x="552" y="278" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">page 3: read only</text><text x="802" y="267" font-family="Consolas, monospace" font-size="12" fill="#52514e">RVA 0x2000</text><line x1="324" y1="186" x2="534" y2="263" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><rect x="120" y="200" width="200" height="23" rx="5" fill="#fde3d6" stroke="#eb6834" stroke-width="1.5"/><text x="132" y="216" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">.pdata</text><text x="110" y="216" font-family="Consolas, monospace" font-size="12" fill="#52514e" text-anchor="end">0x800</text><rect x="540" y="300" width="250" height="62" rx="6" fill="#fde3d6" stroke="#eb6834" stroke-width="1.5"/><text x="552" y="325" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">.pdata</text><text x="552" y="346" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">page 4: read only</text><text x="802" y="335" font-family="Consolas, monospace" font-size="12" fill="#52514e">RVA 0x3000</text><line x1="324" y1="212" x2="534" y2="331" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><text x="220" y="248" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e" text-anchor="middle">2,560 bytes on disk</text><text x="665" y="382" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e" text-anchor="middle">16,384 bytes of address space, that is 4 pages</text><text x="24" y="394" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e">Each section sits on its own page because read, write and execute permissions are set per page</text></svg>