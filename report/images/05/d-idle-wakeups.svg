<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="920" height="320" role="img" aria-label="Idle CPU: wakeups and million cycles per second for five ways of waiting, from 0 to 945 wakeups per second"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0.5" y="0.5" width="919" height="319" rx="14" fill="#fcfcfb" stroke="#e4e2dc"/><text x="24" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#0b0b0b" font-weight="600">Idle CPU by the way the program waits</text><text x="24" y="66" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Wakeups per second</text><text x="224" y="108" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end">Sleep(INFINITE), GetMessage</text><rect x="234" y="94" width="2" height="20" rx="3" fill="#2a78d6"/><text x="242" y="109" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">0</text><text x="224" y="148" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end">SetTimer, 1 second</text><rect x="234" y="134" width="2" height="20" rx="3" fill="#2a78d6"/><text x="242" y="149" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">4</text><text x="224" y="188" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end">Sleep(1) loop</text><rect x="234" y="174" width="23.75999999999999" height="20" rx="3" fill="#2a78d6"/><text x="263.76" y="189" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">99</text><text x="224" y="228" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b