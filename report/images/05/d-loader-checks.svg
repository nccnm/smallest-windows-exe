<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" role="img" aria-label="The checks Windows 11 runs on a tiny exe and the error code at each step"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0.5" y="0.5" width="919" height="559" rx="14" fill="#fcfcfb" stroke="#e4e2dc"/><text x="24" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#0b0b0b" font-weight="600">What Windows 11 checks on a tiny exe (measured on build 26300)</text><rect x="40" y="56" width="400" height="56" rx="8" fill="#fdf0cc" stroke="#eda100" stroke-width="1.5"/><text x="240" y="89" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle">File shorter than e_lfanew + 264 bytes?</text><line x1="440" y1="84" x2="520" y2="84" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><text x="480" y="76" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">Yes</text><rect x="524" y="56" width="356" height="56" rx="8" fill="#fdeaea" stroke="#e34948" stroke-width="1.5"/><text x="540" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Error 216: not compatible</text><text x="540" y="99" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">No process is created</text><line x1="240" y1="112" x2="240" y2="140" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><text x="252" y="131" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e">No</text><rect x="40" y="142" width="400" height="56" rx="8" fill="#fdf0cc" stroke="#eda100" stroke-width="1.5"/><text x="240" y="175" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle">Subsystem version below 3.10?</text><line x1="440" y1="170" x2="520" y2="170" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><text x="480" y="162" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">Yes</text><rect x="524" y="142" width="356" height="56" rx="8" fill="#fdeaea" stroke="#e34948" stroke-width="1.5"/><text x="540" y="166" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Error 193: not a valid Win32 application</text><text x="540" y="185" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">No process is created</text><line x1="240" y1="198" x2="240" y2="226" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><text x="252" y="217" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e">No</text><rect x="40" y="228" width="400" height="56" rx="8" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><text x="240" y="261" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle">Entry point inside the area declared as headers?</text><line x1="440" y1="256" x2="520" y2="256" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><text x="480" y="248" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">Yes</text><rect x="524" y="228" width="356" height="56" rx="8" fill="#fdeaea" stroke="#e34948" stroke-width="1.5"/><text x="540" y="252" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Dies with 0xC000007B</text><text x="540" y="271" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Process was created</text><line x1="240" y1="284" x2="240" y2="312" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><text x="252" y="303" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e">No</text><rect x="40" y="314" width="400" height="56" rx="8" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><text x="240" y="347" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle">Subsystem version 6.3 or higher?</text><line x1="440" y1="342" x2="520" y2="342" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><text x="480" y="334" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">Yes</text><rect x="524" y="314" width="356" height="56" rx="8" fill="#fdeaea" stroke="#e34948" stroke-width="1.5"/><text x="540" y="338" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Dies with 0xC000007B (reason unknown)</text><text x="540" y="357" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Process was created</text><line x1="240" y1="370" x2="240" y2="398" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><text x="252" y="389" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e">No</text><rect x="40" y="400" width="400" height="56" rx="8" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><text x="240" y="433" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle">No sections, yet the code calls an import?</text><line x1="440" y1="428" x2="520" y2="428" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><text x="480" y="420" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">Yes</text><rect x="524" y="400" width="356" height="56" rx="8" fill="#fdeaea" stroke="#e34948" stroke-width="1.5"/><text x="540" y="424" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Dies with 0xC0000005</text><text x="540" y="443" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Import table is ignored</text><line x1="240" y1="456" x2="240" y2="484" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><text x="252" y="475" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e">No</text><rect x="40" y="486" width="400" height="50" rx="8" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="240" y="516" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">Runs. The exit code is the return value</text></svg>