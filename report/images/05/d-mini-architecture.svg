<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-label="Component diagram of the mini build: UI thread with main window, bar window, sampler and GDI renderer; a separate battery thread; relation to explorer.exe"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0.5" y="0.5" width="919" height="519" rx="14" fill="#fcfcfb" stroke="#e4e2dc"/><text x="24" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#0b0b0b" font-weight="600">Proposed architecture for the mini build (one exe, C without CRT)</text><rect x="30" y="48" width="860" height="330" rx="12" fill="none" stroke="#8a8880" stroke-width="1.5"/><text x="46" y="70" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">mini.exe - GUI subsystem, manifest: PerMonitorV2 + Windows 10 support</text><rect x="46" y="84" width="560" height="280" rx="10" fill="none" stroke="#2a78d6" stroke-width="1.5"/><text x="60" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#2a78d6" font-weight="600">UI thread</text><rect x="60" y="116" width="260" height="104" rx="8" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><text x="72" y="138" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Main window (hidden)</text><text x="72" y="158" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Receives WM_TIMER every second</text><text x="72" y="174" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">TaskbarCreated, theme and DPI changes</text><text x="72" y="190" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Display off, lock, HID plug and unplug</text><rect x="334" y="116" width="258" height="104" rx="8" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><text x="346" y="138" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Bar window (child of the taskbar)</text><text x="346" y="158" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Transparent, never takes focus</text><text x="346" y="174" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Right click: Refresh, Exit menu</text><rect x="60" y="236" width="260" height="116" rx="8" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="72" y="258" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Sampler (pure functions)</text><text x="72" y="278" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">CPU: GetSystemTimes</text><text x="72" y="294" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">RAM: GlobalMemoryStatusEx</text><text x="72" y="310" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Network: GetIfTable2</text><text x="72" y="326" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Disk, GPU: PDH or direct APIs</text><rect x="334" y="236" width="258" height="116" rx="8" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="346" y="258" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">GDI renderer</text><text x="346" y="278" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">32-bit bitmap in memory</text><text x="346" y="294" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">White text on a black background</text><text x="346" y="310" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Brightness becomes alpha</text><text x="346" y="326" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">UpdateLayeredWindow</text><line x1="190" y1="220" x2="190" y2="236" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><line x1="320" y1="294" x2="334" y2="294" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><line x1="463" y1="236" x2="463" y2="220" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><rect x="622" y="84" width="254" height="280" rx="10" fill="none" stroke="#eb6834" stroke-width="1.5"/><text x="636" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#eb6834" font-weight="600">Battery thread</text><rect x="636" y="116" width="226" height="158" rx="8" fill="#fde3d6" stroke="#eb6834" stroke-width="1.5"/><text x="648" y="138" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Polls batteries every 60 s</text><text x="648" y="158" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Logitech HID++ 2.0</text><text x="648" y="174" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Bluetooth: device properties</text><text x="648" y="190" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Standard HID: battery level</text><text x="648" y="206" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Xbox: XInput</text><text x="648" y="222" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Waits up to a few seconds per device</text><rect x="636" y="288" width="226" height="62" rx="8" fill="#fde3d6" stroke="#eb6834" stroke-width="1.5"/><text x="648" y="310" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Sends the result</text><text x="648" y="330" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">PostMessage to the main window</text><line x1="749" y1="274" x2="749" y2="288" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><line x1="636" y1="318" x2="322" y2="200" stroke="#8a8880" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><rect x="30" y="400" width="860" height="96" rx="8" fill="#efeee9" stroke="#8a8880" stroke-width="1.5"/><text x="42" y="422" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">explorer.exe</text><text x="42" y="442" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Shell_TrayWnd (the taskbar) is the parent of the bar window</text><text x="42" y="458" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">TrayNotifyWnd (the system tray) is the anchor: the bar sits just left of it</text><text x="42" y="474" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">When Explorer restarts it broadcasts TaskbarCreated; the mini build recreates the bar window</text><line x1="463" y1="220" x2="463" y2="222" stroke="#8a8880" stroke-width="1.5"/><line x1="480" y1="364" x2="480" y2="400" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/></svg>