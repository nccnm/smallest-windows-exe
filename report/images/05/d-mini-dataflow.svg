ont-size="12" fill="#52514e">UpdateLayered-</text><text x="772" y="222" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Window</text><line x1="720" y1="206" x2="758" y2="206" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><line x1="720" y1="310" x2="826" y2="250" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/></svg>