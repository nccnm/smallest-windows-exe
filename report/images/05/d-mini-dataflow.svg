<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="Data flow of the mini build: five data sources feed the Sample structure, then formatting, GDI drawing, positioning, and the taskbar"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0.5" y="0.5" width="919" height="399" rx="14" fill="#fcfcfb" stroke="#e4e2dc"/><text x="24" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#0b0b0b" font-weight="600">Data flow of the mini build: from system APIs to the taskbar</text><rect x="30" y="56" width="230" height="42" rx="8" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="145" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle">GetSystemTimes (CPU)</text><line x1="260" y1="77" x2="318" y2="192" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><rect x="30" y="114" width="230" height="42" rx="8" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="145" y="140" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle">GlobalMemoryStatusEx (RAM)</text><line x1="260" y1="135" x2="318" y2="192" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><rect x="30" y="172" width="230" height="42" rx="8" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="145" y="198" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle">GetIfTable2 (network)</text><line x1="260" y1="193" x2="318" y2="192" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><rect x="30" y="230" width="230" height="42" rx="8" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="145" y="256" font-family="'Segoe UI', system-ui, -apple-system,