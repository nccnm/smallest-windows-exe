<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" role="img" aria-label="Sequence diagram of one 1-second tick: timer, sampling, comparing the text with last time, drawing if different, positioning"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0.5" y="0.5" width="919" height="499" rx="14" fill="#fcfcfb" stroke="#e4e2dc"/><text x="24" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#0b0b0b" font-weight="600">One 1-second tick of the mini build</text><rect x="20" y="46" width="140" height="32" rx="8" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><text x="90" y="67" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">System timer</text><line x1="90" y1="78" x2="90" y2="440" stroke="#8a8880" stroke-width="1" stroke-dasharray="4 4"/><rect x="210" y="46" width="140" height="32" rx="8" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><text x="280" y="67" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">Main window</text><line x1="280" y1="78" x2="280" y2="440" stroke="#8a8880" stroke-width="1" stroke-dasharray="4 4"/><rect x="400" y="46" width="140" height="32" rx="8" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><text x="470" y="67" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">Sampler</text><line x1="470" y1="78" x2="470" y2="440" stroke="#8a8880" stroke-width="1" stroke-dasharray="4 4"/><rect x="580" y="46" width="140" height="32" rx="8" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><text x="650" y="67" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">GDI renderer</text><line x1="650" y1="78" x2="650" y2="440" stroke="#8a8880" stroke-width="1" stroke-dasharray="4 4"/><rect x="760" y="46" width="140" height="32" rx="8" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><text x="830" y="67" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">Taskbar</text><line x1="830" y1="78" x2="830" y2="440" stroke="#8a8880" stroke-width="1" stroke-dasharray="4 4"/><line x1="90" y1="110" x2="278" y2="110" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><text x="185" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle">WM_TIMER</text><text x="288" y="136" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e">paused? then do nothing</text><line x1="280" y1="166" x2="468" y2="166" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><text x="375" y="160" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle">sample</text><text x="478" y="190" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e">CPU, RAM, network, disk, GPU</text><line x1="470" y1="220" x2="282" y2="220" stroke="#8a8880" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="375" y="214" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle">Sample</text><rect x="160" y="238" width="240" height="44" rx="8" fill="#fdf0cc" stroke="#eda100" stroke-width="1.5"/><text x="280" y="257" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">Same text as last time?</text><text x="280" y="273" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">If so, skip the drawing step</text><line x1="280" y1="316" x2="648" y2="316" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><text x="465" y="310" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle">different: draw new text</text><line x1="650" y1="352" x2="828" y2="352" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><text x="740" y="346" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle">UpdateLayeredWindow</text><line x1="280" y1="396" x2="828" y2="396" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arr)"/><text x="555" y="390" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle">position changed: SetWindowPos</text><rect x="30" y="452" width="860" height="34" rx="8" fill="#efeee9"/><text x="46" y="474" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">The battery thread runs on its own: every 60 seconds or on device plug and unplug, it posts the result to the main window, which redraws at once</text></svg>