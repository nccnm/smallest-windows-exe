<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" width="920" height="510" role="img" aria-label="An ordinary exe file compared with the 268-byte file: PE header laid over the DOS header, one field with two meanings, machine code inside the header"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0.5" y="0.5" width="919" height="509" rx="14" fill="#fcfcfb" stroke="#e4e2dc"/><text x="24" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#0b0b0b" font-weight="600">An ordinary file and the 268-byte file: three tricks</text><text x="210" y="62" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">ORDINARY FILE (2,560 bytes)</text><text x="690" y="62" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">268-BYTE FILE</text><rect x="60" y="78" width="300" height="36" rx="5" fill="#fdf0cc" stroke="#eda100" stroke-width="1.5"/><text x="72" y="101" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">DOS header: &quot;MZ&quot;, e_lfanew = 0xD0</text><rect x="60" y="118" width="300" height="30" rx="5" fill="#fdf0cc" stroke="#eda100" stroke-width="1.5"/><text x="72" y="138" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">DOS stub</text><rect x="60" y="152" width="300" height="42" rx="5" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><text x="72" y="178" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">PE header, 264 bytes</text><rect x="60" y="198" width="300" height="30" rx="5" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><text x="72" y="218" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">Section table</text><rect x="60" y="232" width="300" height="30" rx="5" fill="#efeee9" stroke="#8a8880" stroke-width="1.5"/><text x="72" y="252" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">Padding</text><rect x="60" y="266" width="300" height="36" rx="5" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="72" y="289" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">.text: machine code lives here</text><rect x="60" y="306" width="300" height="36" rx="5" fill="#e4e0fa" stroke="#6250d6" stroke-width="1.5"/><text x="72" y="329" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">.rdata: strings, import table</text><rect x="60" y="346" width="300" height="30" rx="5" fill="#fde3d6" stroke="#eb6834" stroke-width="1.5"/><text x="72" y="366" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b">.pdata</text><path d="M 60 96 H 34 V 173 H 56" fill="none" stroke="#e34948" stroke-width="1.8" marker-end="url(#arr)"/><text x="26" y="135" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#e34948" text-anchor="middle" transform="rotate(-90 26 135)">e_lfanew</text><rect x="520" y="78" width="340" height="250" rx="6" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><rect x="520" y="78" width="340" height="30" rx="6" fill="#fdf0cc" stroke="#eda100" stroke-width="1.5"/><text x="532" y="98" font-family="Consolas, monospace" font-size="12.5" fill="#0b0b0b">0x00  &quot;MZ&quot;</text><text x="532" y="130" font-family="Consolas, monospace" font-size="12.5" fill="#0b0b0b">0x04  &quot;PE&quot;: the PE header starts here</text><rect x="530" y="142" width="320" height="34" rx="5" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="540" y="164" font-family="Consolas, monospace" font-size="12.5" fill="#0b0b0b">0x0C  4 bytes of machine code</text><rect x="530" y="184" width="320" height="34" rx="5" fill="#fbdcdc" stroke="#e34948" stroke-width="1.5"/><text x="540" y="206" font-family="Consolas, monospace" font-size="12.5" fill="#0b0b0b">0x3C  one field, two meanings: 4</text><rect x="530" y="226" width="320" height="60" rx="5" fill="#efeee9" stroke="#8a8880" stroke-width="1.5"/><text x="540" y="250" font-family="Consolas, monospace" font-size="12.5" fill="#0b0b0b">0x8C  16 data directory entries</text><text x="588" y="270" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">128 zero bytes that cannot be cut</text><text x="532" y="312" font-family="Consolas, monospace" font-size="12.5" fill="#0b0b0b">0x10C end of file. No sections, no imports</text><circle cx="38" cy="406" r="10" fill="#2a78d6"/><text x="38" y="410" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">1</text><text x="56" y="410" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="600">Overlapped headers</text><text x="218" y="410" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#52514e">e_lfanew = 4, so the PE header lies over the DOS header. Saves 60 bytes of DOS header and the whole DOS stub</text><circle cx="38" cy="436" r="10" fill="#2a78d6"/><text x="38" y="440" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">2</text><text x="56" y="440" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="600">One field, two meanings</text><text x="218" y="440" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#52514e">Field 0x3C is both e_lfanew and SectionAlignment. Both need the value 4</text><circle cx="38" cy="466" r="10" fill="#2a78d6"/><text x="38" y="470" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">3</text><text x="56" y="470" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="600">Code inside the header</text><text x="218" y="470" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#52514e">Four bytes of machine code sit in a header field Windows does not check. No .text section needed</text></svg>