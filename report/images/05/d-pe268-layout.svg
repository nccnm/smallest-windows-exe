<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img" aria-label="Layout of the 268-byte PE file: DOS header and PE header overlap, field 0x3C is both e_lfanew and SectionAlignment"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0.5" y="0.5" width="919" height="439" rx="14" fill="#fcfcfb" stroke="#e4e2dc"/><text x="24" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#0b0b0b" font-weight="600">The 268-byte PE file: two headers laid over each other</text><text x="24" y="50" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">The horizontal axis is the byte position in the file, from 0x000 to 0x10C</text><line x1="60" y1="66" x2="60" y2="250" stroke="#e4e2dc" stroke-width="1"/><text x="60" y="264" font-family="Consolas, monospace" font-size="11" fill="#52514e" text-anchor="middle">0x000</text><line x1="251.04477611940297" y1="66" x2="251.04477611940297" y2="250" stroke="#e4e2dc" stroke-width="1"/><text x="251.04477611940297" y="264" font-family="Consolas, monospace" font-size="11" fill="#52514e" text-anchor="middle">0x040</text><line x1="442.08955223880594" y1="66" x2="442.08955223880594" y2="250" stroke="#e4e2dc" stroke-width="1"/><text x="442.08955223880594" y="264" font-family="Consolas, monospace" font-size="11" fill="#52514e" text-anchor="middle">0x080</text><line x1="633.1343283582089" y1="66" x2="633.1343283582089" y2="250" stroke="#e4e2dc" stroke-width="1"/><text x="633.1343283582089" y="264" font-family="Consolas, monospace" font-size="11" fill="#52514e" text-anchor="middle">0x0C0</text><line x1="812.2388059701493" y1="66" x2="812.2388059701493" y2="250" stroke="#e4e2dc" stroke-width="1"/><text x="798.2388059701493" y="264" font-family="Consolas, monospace" font-size="11" fill="#52514e" text-anchor="middle">0x0FC</text><line x1="860" y1="66" x2="860" y2="250" stroke="#e4e2dc" stroke-width="1"/><text x="870" y="264" font-family="Consolas, monospace" font-size="11" fill="#52514e" text-anchor="middle">0x10C</text><text x="60" y="84" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" font-weight="600">DOS header (64 bytes)</text><rect x="60" y="90" width="191.04477611940297" height="34" rx="4" fill="#fdf0cc" stroke="#eda100" stroke-width="1.5"/><text x="64" y="112" font-family="Consolas, monospace" font-size="11" fill="#0b0b0b">MZ</text><text x="235.1044776119403" y="112" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="end">e_lfanew</text><text x="262.98507462686564" y="146" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" font-weight="600">64-bit PE header (264 bytes), starting at byte 4</text><rect x="71.94029850746269" y="152" width="788.0597014925373" height="34" rx="4" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><text x="77.94029850746269" y="174" font-family="Consolas, monospace" font-size="11" fill="#0b0b0b">PE\0\0</text><text x="483.910447761194" y="174" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e">data directory table (left empty)</text><rect x="239.1044776119403" y="86" width="11.940298507462671" height="104" rx="3" fill="none" stroke="#e34948" stroke-width="2.5"/><text x="60" y="208" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" font-weight="600">Code (4 bytes)</text><rect x="812.2388059701493" y="214" width="12" height="30" rx="4" fill="#eb6834"/><line x1="818.2388059701493" y1="214" x2="818.2388059701493" y2="188" stroke="#eb6834" stroke-width="1.5"/><line x1="245.07462686567163" y1="190" x2="305.07462686567163" y2="300" stroke="#e34948" stroke-width="1.5"/><rect x="60" y="300" width="380" height="118" rx="8" fill="#fdeaea" stroke="#e34948" stroke-width="1.5"/><text x="72" y="322" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Field 0x3C: one field, two meanings</text><text x="72" y="342" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">For the DOS header: e_lfanew = 4</text><text x="72" y="358" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">   (the PE header starts at byte 4)</text><text x="72" y="374" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">For the PE header: SectionAlignment = 4</text><text x="72" y="390" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Both need exactly the value 4</text><rect x="480" y="300" width="380" height="118" rx="8" fill="#efeee9" stroke="#8a8880" stroke-width="1.5"/><text x="492" y="322" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Why it cannot get smaller</text><text x="492" y="342" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Windows requires: file size</text><text x="492" y="358" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">   greater than or equal to e_lfanew + 264</text><text x="492" y="374" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">The smallest e_lfanew is 4, so 4 + 264 = 268</text><text x="492" y="390" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">A 267-byte file is rejected with error 216</text></svg>