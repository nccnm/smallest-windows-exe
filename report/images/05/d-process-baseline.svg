<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-label="What Windows sets up for every process: three basic DLLs, stack, heap, bookkeeping, while the exe file takes a single 4 KB page"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0.5" y="0.5" width="919" height="359" rx="14" fill="#fcfcfb" stroke="#e4e2dc"/><text x="24" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#0b0b0b" font-weight="600">What Windows sets up for every process</text><text x="24" y="52" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Measured minimal process: 3,164 KB of RAM touched. The 768-byte exe file contributes a single 4 KB page</text><rect x="30" y="70" width="860" height="250" rx="12" fill="none" stroke="#8a8880" stroke-width="1.5"/><text x="46" y="92" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">One process, before your first instruction runs</text><rect x="50" y="106" width="400" height="92" rx="8" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><text x="62" y="128" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">ntdll.dll, kernel32.dll, kernelbase.dll</text><text x="62" y="148" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">The basic function set of Windows</text><text x="62" y="164" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Every program needs them, even if you never ask</text><rect x="470" y="106" width="400" height="92" rx="8" fill="#fdf0cc" stroke="#eda100" stroke-width="1.5"/><text x="482" y="128" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Stack</text><text x="482" y="148" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Scratch paper of a thread: temporary variables and</text><text x="482" y="164" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">&quot;which function am I in, where do I return to&quot;</text><rect x="50" y="210" width="270" height="92" rx="8" fill="#e4e0fa" stroke="#6250d6" stroke-width="1.5"/><text x="62" y="232" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Heap</text><text x="62" y="252" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">The store a program asks for more</text><text x="62" y="268" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">memory from when it needs it</text><rect x="336" y="210" width="270" height="92" rx="8" fill="#efeee9" stroke="#8a8880" stroke-width="1.5"/><text x="348" y="232" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Process bookkeeping</text><text x="348" y="252" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Windows records who this process is</text><text x="348" y="268" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">and what it currently holds</text><rect x="622" y="210" width="248" height="92" rx="8" fill="#d6f3e8" stroke="#1baf7a" stroke-width="1.5"/><text x="634" y="232" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Your exe file</text><text x="634" y="252" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">1 page = 4 KB</text><text x="634" y="268" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">under 1% of the whole process</text><text x="24" y="346" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e">Squeezing the file from 768 to 268 bytes changes nothing here: RAM is handed out in 4 KB pages, not in bytes</text></svg>