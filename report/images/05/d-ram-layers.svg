<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 498" width="920" height="498" role="img" aria-label="RAM ladder: commit and Working Set layer by layer, from kernel32 only to a window with a button, plus conhost.exe"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0.5" y="0.5" width="919" height="497" rx="14" fill="#fcfcfb" stroke="#e4e2dc"/><text x="24" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#0b0b0b" font-weight="600">How much RAM each layer adds (KB)</text><rect x="24" y="44" width="12" height="12" rx="3" fill="#2a78d6"/><text x="42" y="55" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Private Bytes (commit)</text><rect x="200" y="44" width="12" height="12" rx="3" fill="#eb6834"/><text x="218" y="55" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Working Set</text><line x1="230" y1="78" x2="230" y2="444" stroke="#e4e2dc" stroke-width="1"/><text x="230" y="462" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">0 MB</text><line x1="355" y1="78" x2="355" y2="444" stroke="#e4e2dc" stroke-width="1"/><text x="355" y="462" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">3 MB</text><line x1="480" y1="78" x2="480" y2="444" stroke="#e4e2dc" stroke-width="1"/><text x="480" y="462" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">6 MB</text><line x1="605" y1="78" x2="605" y2="444" stroke="#e4e2dc" stroke-width="1"/><text x="605" y="462" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">9 MB</text><line x1="730" y1="78" x2="730" y2="444" stroke="#e4e2dc" stroke-width="1"/><text x="730" y="462" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">12 MB</text><text x="220" y="98" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end">kernel32 only</text><text x="220" y="114" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e" text-anchor="end">1 thread, 4 DLLs</text><rect x="230" y="84" width="19.166666666666657" height="15" rx="3" fill="#2a78d6"/><text x="255.16666666666666" y="96" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">460</text><rect x="230" y="101" width="131.83333333333337" height="15" rx="3" fill="#eb6834"/><text x="367.83333333333337" y="113" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">3,164</text><text x="220" y="144" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end">Static CRT /MT</text><text x="220" y="160" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e" text-anchor="end">1 thread, 4 DLLs</text><rect x="230" y="130" width="21" height="15" rx="3" fill="#2a78d6"/><text x="257" y="142" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">504</text><rect x="230" y="147" width="144.83333333333337" height="15" rx="3" fill="#eb6834"/><text x="380.83333333333337" y="159" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">3,476</text><text x="220" y="190" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end">Dynamic CRT /MD</text><text x="220" y="206" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e" text-anchor="end">4 then 1 thread, 6 DLLs</text><rect x="230" y="176" width="26.5" height="15" rx="3" fill="#2a78d6"/><text x="262.5" y="188" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">636</text><rect x="230" y="193" width="157.16666666666669" height="15" rx="3" fill="#eb6834"/><text x="393.1666666666667" y="205" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">3,772</text><text x="220" y="236" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end">Add user32, no window yet</text><text x="220" y="252" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e" text-anchor="end">4 then 1 thread, 11 DLLs</text><rect x="230" y="222" width="35.666666666666686" height="15" rx="3" fill="#2a78d6"/><text x="271.6666666666667" y="234" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">856</text><rect x="230" y="239" width="198.5" height="15" rx="3" fill="#eb6834"/><text x="434.5" y="251" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">4,764</text><text x="220" y="282" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end">One window, IME disabled</text><text x="220" y="298" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e" text-anchor="end">1 thread, 16 DLLs</text><rect x="230" y="268" width="44" height="15" rx="3" fill="#2a78d6"/><text x="280" y="280" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">1,056</text><rect x="230" y="285" width="279" height="15" rx="3" fill="#eb6834"/><text x="515" y="297" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">6,696</text><text x="220" y="328" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end">One window, default</text><text x="220" y="344" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e" text-anchor="end">3 threads, 26 DLLs</text><rect x="230" y="314" width="64.83333333333337" height="15" rx="3" fill="#2a78d6"/><text x="300.83333333333337" y="326" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">1,556</text><rect x="230" y="331" width="485.41666666666674" height="15" rx="3" fill="#eb6834"/><text x="721.4166666666667" y="343" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">11,650</text><text x="220" y="374" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end">Window with a button, comctl32 v6</text><text x="220" y="390" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e" text-anchor="end">4 threads, 24 DLLs</text><rect x="230" y="360" width="64.83333333333337" height="15" rx="3" fill="#2a78d6"/><text x="300.83333333333337" y="372" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">1,556</text><rect x="230" y="377" width="431.83333333333337" height="15" rx="3" fill="#eb6834"/><text x="667.8333333333334" y="389" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">10,364</text><line x1="24" y1="400" x2="896" y2="400" stroke="#e4e2dc" stroke-width="1.5" stroke-dasharray="4 4"/><text x="220" y="420" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end">conhost.exe (with a new console)</text><text x="220" y="436" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e" text-anchor="end">6 threads</text><rect x="230" y="406" width="67.66666666666669" height="15" rx="3" fill="#2a78d6"/><text x="303.6666666666667" y="418" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">1,624</text><rect x="230" y="423" width="444.16666666666663" height="15" rx="3" fill="#eb6834"/><text x="680.1666666666666" y="435" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">10,660</text></svg>