<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" role="img" aria-label="The 3,164 KB Working Set of the minimal process is 2,896 KB of shared pages plus 264 KB of private pages; Private Bytes is 460 KB"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0.5" y="0.5" width="919" height="329" rx="14" fill="#fcfcfb" stroke="#e4e2dc"/><text x="24" y="30" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#0b0b0b" font-weight="600">RAM of the minimal process: the shared part and the private part</text><text x="24" y="52" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Working Set 3,164 KB, drawn to scale</text><rect x="30" y="72" width="787.1554993678888" height="78" rx="6" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.5"/><rect x="821.1554993678888" y="72" width="68.84450063211125" height="78" rx="6" fill="#fde3d6" stroke="#eb6834" stroke-width="1.5"/><text x="46" y="100" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#0b0b0b" font-weight="600">SHARED: 2,896 KB</text><text x="46" y="122" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#52514e">Code of the Windows DLLs. Like books on a library shelf:</text><text x="46" y="140" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#52514e">one copy for the whole machine, read by every program</text><text x="855.5777496839444" y="104" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">PRIVATE</text><text x="855.5777496839444" y="124" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle">264 KB</text><line x1="857.1554993678888" y1="150" x2="857.1554993678888" y2="176" stroke="#8a8880" stroke-width="1.5"/><text x="890" y="192" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#52514e" text-anchor="end">Private, like your own notebook: stack, heap, variables, and the exe file</text><rect x="30" y="214" width="420" height="84" rx="8" fill="#efeee9" stroke="#8a8880" stroke-width="1.5"/><text x="42" y="236" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Working Set = shared + private</text><text x="42" y="256" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Answers: how much RAM is the program touching?</text><text x="42" y="272" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Here: 3,164 KB</text><rect x="470" y="214" width="420" height="84" rx="8" fill="#fde3d6" stroke="#eb6834" stroke-width="1.5"/><text x="482" y="236" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Private Bytes = only the private part requested</text><text x="482" y="256" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Answers: how much extra does the program cost the machine?</text><text x="482" y="272" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#52514e">Here: 460 KB, including memory requested but not yet used</text><text x="24" y="320" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#52514e">Closing a program only gives back the private part. To see what a program costs, look at Private Bytes</text></svg>